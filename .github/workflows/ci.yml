name: CI

on:
  push:
    branches: [main]
  pull_request:

# Public repo: CI runs on GitHub-hosted runners (free for public repos), never
# on a self-hosted machine — a pull request from a fork must not run its code
# on our infrastructure. The check job needs no secrets, so fork and
# Dependabot PRs run the full suite.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm dlx prettier@3.9.6 --check .

      # build first: typecheck needs .next/types from it.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # Every green main commit publishes the image production runs, tagged with
  # the commit sha.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # GHCR names must be lowercase; the org is "Wirepayment".
      IMAGE: ghcr.io/wirepayment/wire-landing
    steps:
      - uses: actions/checkout@v7

      # NEXT_PUBLIC_* are inlined at build time: an image without the DSN
      # ships without error reporting. Refuse rather than warn.
      - name: sentry inputs
        env:
          DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          if [ -z "$DSN" ]; then
            echo "::error::NEXT_PUBLIC_SENTRY_DSN variable unset — refusing to publish without Sentry"
            exit 1
          fi

      - name: ghcr login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --build-arg "NEXT_PUBLIC_DASHBOARD_URL=${{ vars.NEXT_PUBLIC_DASHBOARD_URL || 'https://app.wire.mn' }}" \
            --build-arg "NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}" \
            --build-arg "NEXT_PUBLIC_SENTRY_ENV=production" \
            --build-arg "NEXT_PUBLIC_GIT_SHA=${{ github.sha }}" \
            --build-arg "SENTRY_ORG=${{ vars.SENTRY_ORG }}" \
            --build-arg "SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}" \
            --secret "id=sentrytoken,env=SENTRY_AUTH_TOKEN" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .

      # Retried: GHCR occasionally answers `denied` on a first push.
      - name: push
        run: |
          for tag in "${{ github.sha }}" main; do
            for attempt in 1 2 3; do
              docker push "$IMAGE:$tag" && break
              [ "$attempt" = 3 ] && exit 1
              echo "::warning::push $IMAGE:$tag failed (attempt $attempt), retrying"
              sleep 15
            done
          done
